name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O Redmi passa a "chamar" o Pixel por Bluetooth assim que o carro se liga
      # (repoe a funcao retirada na v1.0.2) e deixa de ligar o Redmi ao Bluetooth do carro
      - name: Repor chamada Bluetooth ao telemovel
        run: |
          git -c user.email=build@local -c user.name=build revert --no-commit 279958c
          H=app/src/main/java/com/ezabi/wirelessaabridge/bluetooth/HfpHandsfreeServer.kt
          B=app/src/main/java/com/ezabi/wirelessaabridge/bridge/BridgeController.kt
          sed -i 's/if (name.contains("toyota", ignoreCase = true)) continue/if (name.contains("toyota", ignoreCase = true) || name.contains("LN01A", ignoreCase = true) || name.contains("opel", ignoreCase = true)) continue/' $H
          sed -i 's/^\( *\)connectCarHandsfree()$/\1\/\/ connectCarHandsfree()  (desligado: Opel nao precisa)/' $B
          grep -n "LN01A\|connectToPairedAg()\|(desligado: Opel" $H $B

      # >>> MUDA AQUI a palavra-passe da rede Wi-Fi do telemóvel ponte (8 a 63 caracteres) <<<
      - name: Definir palavra-passe Wi-Fi
        run: |
          sed -i 's/const val P2P_PASS = "aabridge"/const val P2P_PASS = "MudaEstaPalavra123"/' \
            app/src/main/java/com/ezabi/wirelessaabridge/wifi/HotspotManager.kt
          grep -n "P2P_PASS =" app/src/main/java/com/ezabi/wirelessaabridge/wifi/HotspotManager.kt

      # Modo de teste sem carro: ativa-se abrindo a app com "--ez desk true" via ADB
      - name: Ativar modo de teste (desk mode)
        run: |
          perl -0pi -e 's/(private fun handleIntent\(intent: android\.content\.Intent\?\) \{\n)/$1        if (intent?.getBooleanExtra("desk", false) == true) {\n            bridge.deskMode = true\n            appendLog("DESK MODE: teste sem carro ligado")\n        }\n/' \
            app/src/main/java/com/ezabi/wirelessaabridge/ui/MainActivity.kt
          grep -n "DESK MODE" app/src/main/java/com/ezabi/wirelessaabridge/ui/MainActivity.kt

      # Android 11+ esconde o endereço MAC (BSSID) a apps com targetSdk 30;
      # com 29 a app consegue ler o BSSID real da rede Wi-Fi Direct
      - name: Corrigir leitura do BSSID (targetSdk 29)
        run: |
          sed -i 's/targetSdk = 30/targetSdk = 29/' app/build.gradle.kts
          grep -n "targetSdk" app/build.gradle.kts

      # >>> MAC real da interface p2p0 do Redmi (de "adb shell ip link") <<<
      - name: Corrigir BSSID (ler MAC por outros meios + valor fixo)
        run: |
          cat > /tmp/fix_mac.py <<'PYEOF'
          import re, sys
          p = "app/src/main/java/com/ezabi/wirelessaabridge/wifi/HotspotManager.kt"
          s = open(p).read()
          old = re.search(r"    private fun readInterfaceMac\(iface: String\): String\? = try \{\n.*?\n    \}\n", s, re.S)
          assert old, "readInterfaceMac not found"
          new = '''    private fun readInterfaceMac(iface: String): String? {
                  val bad = "02:00:00:00:00:00"
                  val macRe = Regex("([0-9A-F]{2}:){5}[0-9A-F]{2}")
                  try {
                      val hw = NetworkInterface.getByName(iface)?.hardwareAddress
                      if (hw != null) {
                          val m = hw.joinToString(":") { "%02X".format(it) }
                          if (m != bad) { log.i(TAG, "MAC $iface via NetworkInterface: $m"); return m }
                      }
                  } catch (e: Exception) { }
                  try {
                      val f = java.io.File("/sys/class/net/" + iface + "/address")
                      val m = f.readText().trim().uppercase()
                      if (macRe.matches(m) && m != bad) { log.i(TAG, "MAC $iface via sysfs: $m"); return m }
                  } catch (e: Exception) { }
                  try {
                      val proc = ProcessBuilder("ip", "link", "show", iface).redirectErrorStream(true).start()
                      val out = proc.inputStream.bufferedReader().readText()
                      proc.waitFor()
                      val m = Regex("link/ether ([0-9a-fA-F:]{17})").find(out)?.groupValues?.get(1)?.uppercase()
                      if (m != null && m != bad) { log.i(TAG, "MAC $iface via ip link: $m"); return m }
                  } catch (e: Exception) { }
                  val fixed = FIXED_P2P_MAC.uppercase()
                  if (iface == "p2p0" && macRe.matches(fixed)) {
                      log.w(TAG, "MAC $iface: using fixed value $fixed")
                      return fixed
                  }
                  log.w(TAG, "MAC $iface: could not read")
                  return null
              }
          '''
          s = s[:old.start()] + new + s[old.end():]
          s = s.replace('        const val P2P_PASS = ', '        const val FIXED_P2P_MAC = "' + sys.argv[1] + '"\n        const val P2P_PASS = ', 1)
          open(p, "w").write(s)
          print("patched readInterfaceMac, FIXED_P2P_MAC =", sys.argv[1])
          PYEOF
          python3 /tmp/fix_mac.py "22:67:0b:2d:8a:74"
          grep -n "FIXED_P2P_MAC\|via ip link" app/src/main/java/com/ezabi/wirelessaabridge/wifi/HotspotManager.kt

      # Filtro USB: aceitar qualquer versão enviada pelo rádio (não só "1.0")
      - name: Alargar filtro de acessório USB
        run: |
          sed -i 's/^\( *\)version="1.0" \/>/\1\/>/' app/src/main/res/xml/accessory_filter.xml
          sed -i 's#</resources>#    <usb-accessory />\n</resources>#' app/src/main/res/xml/accessory_filter.xml
          cat app/src/main/res/xml/accessory_filter.xml

      # Ordem "telemovel primeiro, carro depois": nao enviar pedidos de versao falsos
      # ao Pixel enquanto o carro nao esta ligado (sonda + heartbeat), para o Pixel
      # ficar a espera do pedido verdadeiro do carro
      - name: Desligar sonda e heartbeat sem carro
        run: |
          F=app/src/main/java/com/ezabi/wirelessaabridge/bridge/BridgeController.kt
          sed -i 's/^\( *\)probeIfNoCar(sock)$/\1\/\/ probeIfNoCar(sock)  (desligado)/' $F
          sed -i 's/^\( *\)startSessionWatchdog()$/\1\/\/ startSessionWatchdog()  (desligado)/' $F
          grep -n "(desligado)" $F

      # Replug USB virtual via Shizuku quando o Pixel esta pronto e o carro ja desistiu
      - name: Adicionar replug USB via Shizuku
        run: |
          cat > /tmp/UsbReplug.kt <<'KTEOF'
          package com.ezabi.wirelessaabridge.usb

          import android.content.Context
          import android.content.pm.PackageManager
          import com.ezabi.wirelessaabridge.logging.LogManager
          import rikka.shizuku.Shizuku

          /**
           * "Virtual replug" of the USB port through Shizuku (adb-level shell, no root).
           * When the phone is on TCP but the car has already given up on the accessory,
           * switching the USB functions off and back on makes the car see a fresh device
           * and start the Android Auto (AOA) handshake again, now with the phone ready.
           */
          object UsbReplug {
              private const val TAG = "UsbReplug"
              private const val REQUEST_CODE = 4242
              @Volatile private var lastMs = 0L
              @Volatile private var listenerAdded = false

              fun ready(): Boolean = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) {
                  false
              }

              fun requestPermissionIfNeeded(log: LogManager) {
                  if (listenerAdded) return
                  listenerAdded = true
                  try {
                      Shizuku.addBinderReceivedListenerSticky {
                          try {
                              if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) {
                                  log.i(TAG, "Shizuku ready (permission granted)")
                              } else {
                                  log.i(TAG, "Asking Shizuku permission")
                                  Shizuku.requestPermission(REQUEST_CODE)
                              }
                          } catch (e: Throwable) {
                              log.w(TAG, "Shizuku permission check failed: ${e.message}")
                          }
                      }
                      if (!Shizuku.pingBinder()) log.w(TAG, "Shizuku is not running yet")
                  } catch (e: Throwable) {
                      log.w(TAG, "Shizuku unavailable: ${e.javaClass.simpleName}: ${e.message}")
                  }
              }

              /** After a short wait, replug USB unless [carAlreadyThere] says the car side is live. */
              fun replugLater(context: Context, carAlreadyThere: () -> Boolean) {
                  val log = LogManager.getInstance(context)
                  Thread({
                      try {
                          Thread.sleep(1500)
                          if (carAlreadyThere()) {
                              log.i(TAG, "Car side already live, no replug needed")
                              return@Thread
                          }
                          val now = System.currentTimeMillis()
                          if (now - lastMs < 20_000) {
                              log.i(TAG, "Replug skipped (last one was less than 20 s ago)")
                              return@Thread
                          }
                          if (!ready()) {
                              log.w(TAG, "Cannot replug: Shizuku not running or permission missing")
                              return@Thread
                          }
                          lastMs = now
                          log.i(TAG, "Phone ready but no car: USB virtual replug")
                          run(log, "svc usb setFunctions")
                          Thread.sleep(2000)
                          run(log, "svc usb setFunctions mtp")
                          log.i(TAG, "USB virtual replug done, waiting for the car")
                      } catch (e: Throwable) {
                          log.e(TAG, "Replug failed: ${e.javaClass.simpleName}: ${e.message}")
                      }
                  }, "UsbReplug").apply { isDaemon = true; start() }
              }

              private fun run(log: LogManager, cmd: String) {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText()
                  val err = p.errorStream.bufferedReader().readText()
                  val rc = p.waitFor()
                  log.i(TAG, "shell: $cmd -> rc=$rc ${(out + err).trim()}")
              }
          }
          KTEOF
          cat > /tmp/add_shizuku.py <<'PYEOF'
          import sys
          root = "app/src/main"
          pkg = root + "/java/com/ezabi/wirelessaabridge"

          def sub(path, old, new, count=1):
              s = open(path).read()
              assert old in s, f"not found in {path}: {old[:60]!r}"
              s = s.replace(old, new, count)
              open(path, "w").write(s)
              print("patched", path)

          # 1. new helper class
          open(pkg + "/usb/UsbReplug.kt", "w").write(open(sys.argv[1]).read())
          print("wrote UsbReplug.kt")

          # 2. dependencies
          sub("app/build.gradle.kts",
              '    implementation("com.google.zxing:core:3.5.3")',
              '    implementation("com.google.zxing:core:3.5.3")\n'
              '    implementation("dev.rikka.shizuku:api:13.1.5")\n'
              '    implementation("dev.rikka.shizuku:provider:13.1.5")')

          # 3. Shizuku provider in manifest
          sub(root + "/AndroidManifest.xml", "    </application>",
              '        <provider\n'
              '            android:name="rikka.shizuku.ShizukuProvider"\n'
              '            android:authorities="${applicationId}.shizuku"\n'
              '            android:multiprocess="false"\n'
              '            android:enabled="true"\n'
              '            android:exported="true"\n'
              '            android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />\n'
              '    </application>')

          # 4. ask Shizuku permission at app start
          sub(pkg + "/ui/MainActivity.kt", "        bridge.setCarUsb(usbManager)\n",
              "        bridge.setCarUsb(usbManager)\n"
              "        com.ezabi.wirelessaabridge.usb.UsbReplug.requestPermissionIfNeeded(logManager)\n")

          B = pkg + "/bridge/BridgeController.kt"
          # 5. phone on TCP and no car -> virtual replug
          sub(B, "            // probeIfNoCar(sock)  (desligado)\n",
              "            com.ezabi.wirelessaabridge.usb.UsbReplug.replugLater(context) {\n"
              "                carUsb?.isConnected() == true || relay.isRunning()\n"
              "            }\n")
          # 6. when the car comes back after the replug, do not ring the phone again
          sub(B, 'ringing the paired phone (bridge is the head unit)")\n        hfp.connectToPairedAg()\n',
              'ringing the paired phone (bridge is the head unit)")\n        if (pendingPhone == null) hfp.connectToPairedAg()\n')
          PYEOF
          python3 /tmp/add_shizuku.py /tmp/UsbReplug.kt
          grep -n "UsbReplug\|pendingPhone == null" app/src/main/java/com/ezabi/wirelessaabridge/bridge/BridgeController.kt app/src/main/java/com/ezabi/wirelessaabridge/ui/MainActivity.kt
          grep -n "shizuku" app/build.gradle.kts app/src/main/AndroidManifest.xml

      # Responder ao carro antes de ele desistir (~6 s apos o pedido), para ganhar
      # mais ~15 s de paciencia do carro enquanto o Pixel chega
      - name: Encurtar espera da resposta de versao ao carro
        run: |
          F=app/src/main/java/com/ezabi/wirelessaabridge/usb/CarUsbManager.kt
          sed -i 's/private val SYNTHETIC_FALLBACK_MS = 60_000L/private val SYNTHETIC_FALLBACK_MS = 6_000L/' $F
          grep -n "SYNTHETIC_FALLBACK_MS =" $F

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wireless-aa-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
